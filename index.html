<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akshay ❤️ Madhuri</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: 'Georgia', serif;
  color: white;
  text-align: center;
}

/* FLASH EFFECT */
.flash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  z-index: 9;
}

/* ENVELOPE SCREEN */
#envelopeScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #222, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

/* ENVELOPE */
.envelope {
  width: 240px;
  height: 150px;
  background: linear-gradient(135deg, #d4af37, #b8964a);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px gold, 0 0 40px rgba(255,215,0,0.6);
  cursor: pointer;
}

/* FLAP */
.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #b8964a, #a07c2f);
  clip-path: polygon(0 0, 50% 65%, 100% 0);
  transform-origin: top;
  transition: 1s;
  z-index: 2;
}

/* CARD */
.card {
  position: absolute;
  width: 90%;
  height: 120%;
  background: white;
  color: black;
  top: 100%;
  left: 5%;
  border-radius: 8px;
  padding: 15px;
  transition: 1.5s;
}

/* OPEN */
.open .flap {
  transform: rotateX(180deg);
}

.open .card {
  top: -30%;
}

/* BUTTON */
.open-text {
  margin-top: 25px;
  background: gold;
  padding: 12px 25px;
  border-radius: 30px;
  font-size: 18px;
  animation: pulse 1.5s infinite;
  cursor: pointer;
}

@keyframes pulse {
  0% {box-shadow: 0 0 0 0 rgba(255,215,0,0.7);}
  70% {box-shadow: 0 0 0 20px rgba(255,215,0,0);}
  100% {box-shadow: 0 0 0 0 rgba(255,215,0,0);}
}

/* HERO */
.hero {
  height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
    url('photo1.jpg') no-repeat center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  animation: zoomBg 20s infinite alternate;
}

@keyframes zoomBg {
  from {background-size: 100%;}
  to {background-size: 110%;}
}

/* NAME ANIMATION */
.hero h1 {
  font-size: 50px;
  color: gold;
  text-shadow: 0 0 10px gold, 0 0 20px gold;
  overflow: hidden;
  white-space: nowrap;
  border-right: 3px solid gold;
  width: 0;
  animation: typing 4s steps(30,end) forwards, blink 0.7s infinite;
}

@keyframes typing {
  from {width: 0;}
  to {width: 100%;}
}

@keyframes blink {
  50% {border-color: transparent;}
}

/* SECTION */
.section {
  padding: 70px 20px;
  background: #111;
}

/* GALLERY */
.gallery img {
  width: 90%;
  max-width: 400px;
  margin: 10px;
  border-radius: 10px;
}

/* WATERMARK */
.watermark {
  position: fixed;
  bottom: 10px;
  width: 100%;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<!-- ENVELOPE -->
<div id="envelopeScreen">
  <div class="envelope" id="env">
    <div class="flap"></div>

    <div class="card">
      <h4>💌 आमंत्रण</h4>
      <p>Akshay ❤️ Madhuri</p>
      <p>29 एप्रिल 2026</p>
    </div>
  </div>

  <div class="open-text" onclick="openLetter()">उघडा</div>
</div>

<!-- MAIN -->
<div id="mainContent" style="display:none;">

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<div class="hero">
  <h1>Akshay ❤️ Madhuri</h1>
  <p>29 April 2026 | 12:35:00 PM</p>
</div>

<div class="section">
  <h2>Countdown ⏳</h2>
  <h1 id="countdown"></h1>
</div>

<div class="section">
  <h2>Wedding Details 💐</h2>
  <p>📅 29 एप्रिल 2026</p>
  <p>⏰ 12:35:00 दुपारी</p>
  <p>
  📍 रायगड लॉन्स , १९ मैल, घारगाव , नाशिक पुणे हायवे ,  
  संगमनेर, जी अहिल्यानगर
  </p>

  <a href="https://maps.app.goo.gl/HsUfHwqSsFvuAP3R9" target="_blank">
    <button>Location Open 📍</button>
  </a>
</div>

<div class="section gallery">
  <h2>Our Memories 📸</h2>
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
  <img src="photo4.jpg">
  <img src="photo5.jpg">
</div>

</div>

<div class="watermark">Rushya Cinematic</div>

<script>
function openLetter() {
  let env = document.getElementById("env");
  let flash = document.getElementById("flash");

  env.classList.add("open");

  flash.style.opacity = "1";
  flash.style.transition = "0.3s";

  setTimeout(() => {
    flash.style.opacity = "0";
  }, 300);

  document.getElementById("envelopeScreen").style.transform = "scale(1.3)";
  document.getElementById("envelopeScreen").style.transition = "1s";

  setTimeout(() => {
    document.getElementById("envelopeScreen").style.opacity = "0";
  }, 700);

  setTimeout(() => {
    document.getElementById("envelopeScreen").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
  }, 1400);
}

// COUNTDOWN
var countDownDate = new Date("April 29, 2026 12:35:00").getTime();

setInterval(function() {
  var now = new Date().getTime();
  var d = countDownDate - now;

  var days = Math.floor(d / (1000*60*60*24));
  var hours = Math.floor((d % (1000*60*60*24))/(1000*60*60));
  var minutes = Math.floor((d % (1000*60*60))/(1000*60));
  var seconds = Math.floor((d % (1000*60))/1000);

  document.getElementById("countdown").innerHTML =
    days+"d "+hours+"h "+minutes+"m "+seconds+"s";
},1000);
</script>

</body>
</html>
